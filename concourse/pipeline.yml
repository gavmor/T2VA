# T2VA -- Esoteria (1998) character/enemy roster reference-sheet generation.
#
# Ported architecture from blades68-lora's h3-charref-fullredo job (see that
# repo's concourse/pipeline.yml, 2026-08-23): same validated MiniMax H3 T2VA
# (text-to-video+audio, no reference image) node graph, same gpu-lock
# cross-pipeline mutual-exclusion pattern, same
# submit->poll->fetch->extract->compose flow. T2VA mode was chosen
# deliberately, not provisionally -- see ../data/raw_texture_status.md for
# why the Esoteria asset RE work doesn't (yet) provide real character
# textures to condition an R2V (reference-image) render on.
#
# Two jobs:
#   - t2va-single: workshop/regen exactly one roster entry, selected by the
#     ((char_slug)) pipeline var. Re-set the pipeline with a new var value
#     to target a different character -- see README.md for the exact
#     command. This is the "workshop extensively" entry point.
#   - t2va-batch-all: the full 30-entry roster in one gpu-lock-serialized
#     batch, for once the per-character technique is validated.
#
# Never curl comfyui-local's /prompt endpoint outside this pipeline -- see
# the genops AGENTS.md hard rule this repo inherits (no VRAM pre-flight
# check exists, only this gpu-lock mutex).

resources:
  - name: t2va-repo
    type: git
    icon: source-repository
    source:
      uri: https://github.com/gavmor/T2VA.git
      branch: main

  # Same physical gpu-lock pool blades68-lora's pipeline uses (this box has
  # exactly one GPU) -- cross-pipeline exclusivity requires sharing the one
  # pool, not standing up a second one.
  - name: gpu-lock
    type: pool
    icon: lock
    source:
      uri: git@github.com:gavmor/concourse-locks.git
      branch: main
      pool: gpu
      private_key: ((gpu_lock_repo_private_key))

  # Reuses blades68-lora's existing self-hosted MinIO bucket under a
  # dedicated t2va/ prefix, rather than standing up a second bucket for a
  # pipeline this small.
  - name: t2va-sheets-s3
    type: s3
    icon: archive-outline
    source:
      endpoint: ((minio_endpoint))
      bucket: ((minio_bucket))
      regexp: t2va/t2va-sheets-(.*)\.tar\.gz
      access_key_id: ((minio_access_key))
      secret_access_key: ((minio_secret_key))
      region_name: us-east-1

jobs:
  - name: t2va-single
    serial_groups: [gpu]
    plan:
      - get: t2va-repo
      - put: gpu-lock
        params: { acquire: true }
      - task: render-one
        timeout: 15m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo }]
          outputs: [{ name: raw-videos }, { name: charref-sheets }]
          params:
            COMFYUI_LOCAL_URL: ((comfyui_local_url))
            CHAR_SLUG: ((char_slug))
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache curl jq python3 ffmpeg imagemagick font-dejavu >/dev/null
                cd t2va-repo
                python3 scripts/build_manifest.py --slug "$CHAR_SLUG"
                MANIFEST=gen/manifest.json
                ENTRY=$(jq -c '.[0]' "$MANIFEST")
                SLUG=$(echo "$ENTRY" | jq -r '.slug')
                PROMPT_TEXT=$(echo "$ENTRY" | jq -r '.prompt')
                SEED=$(echo "$ENTRY" | jq -r '.seed')
                python3 scripts/build_t2va_prompt.py \
                  --prompt "$PROMPT_TEXT" --seed "$SEED" \
                  --output-prefix "t2va/${SLUG}" \
                  --client-id "t2va-single-${SLUG}" > /tmp/prompt.json
                echo "--- [$(date -Iseconds)] submitting $SLUG (seed=$SEED) ---"
                RESP=$(curl -sf -X POST "$COMFYUI_LOCAL_URL/prompt" \
                  -H 'Content-Type: application/json' --data @/tmp/prompt.json)
                PROMPT_ID=$(echo "$RESP" | jq -r .prompt_id)
                if [ -z "$PROMPT_ID" ] || [ "$PROMPT_ID" = "null" ]; then
                  echo "FAILED to submit $SLUG: $RESP"; exit 1
                fi
                COMPLETED=false
                for j in $(seq 1 60); do
                  sleep 3
                  HIST=$(curl -sf "$COMFYUI_LOCAL_URL/history/$PROMPT_ID") || continue
                  if [ "$HIST" != "{}" ]; then
                    STATUS=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".status.completed")
                    if [ "$STATUS" = "true" ]; then
                      COMPLETED=true
                      COMFY_FILE=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].filename // .\"$PROMPT_ID\".outputs.\"612\".video[0].filename // .\"$PROMPT_ID\".outputs.\"612\".videos[0].filename // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].filename")
                      COMFY_SUBFOLDER=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".video[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".videos[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].subfolder // \"\"")
                      if [ -z "$COMFY_FILE" ] || [ "$COMFY_FILE" = "null" ]; then
                        echo "FAILED: $SLUG completed but no video filename in outputs.612"; exit 1
                      fi
                      curl -sf -G "$COMFYUI_LOCAL_URL/view" \
                        --data-urlencode "filename=$COMFY_FILE" \
                        --data-urlencode "subfolder=$COMFY_SUBFOLDER" \
                        --data-urlencode "type=output" \
                        -o "../raw-videos/${SLUG}.mp4" \
                        || { echo "FAILED to fetch $SLUG"; exit 1; }
                      echo "VIDEO_RESULT slug=$SLUG comfy_filename=$COMFY_FILE prompt_id=$PROMPT_ID"
                      break
                    elif [ "$STATUS" = "false" ] && echo "$HIST" | jq -e ".\"$PROMPT_ID\".status.status_str == \"error\"" >/dev/null 2>&1; then
                      echo "FAILED: $SLUG -- comfyui-local execution error: $(echo "$HIST" | jq -c ".\"$PROMPT_ID\".status")"; exit 1
                    fi
                  fi
                done
                if [ "$COMPLETED" != "true" ]; then
                  echo "TIMEOUT waiting for $SLUG (prompt_id=$PROMPT_ID)"; exit 1
                fi
                python3 scripts/extract_and_compose.py --slug "$SLUG" \
                  --manifest "$MANIFEST" --video-dir ../raw-videos \
                  --stills-dir /tmp/t2va-stills --sheets-dir ../charref-sheets
                # t2va-single's charref-sheets output is ephemeral (this
                # task container is gone once the build ends) -- upload the
                # finished sheet to comfyui-local's own output store so it's
                # actually retrievable afterwards, same pattern
                # h3-charref-fullredo's extract-and-compose task already
                # uses for its final composited sheets.
                SHEET="../charref-sheets/${SLUG}_charref.png"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${SHEET};filename=${SLUG}_charref.png" \
                  -F "type=output" -F "subfolder=t2va-single" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload ${SLUG}_charref.png"; exit 1; }
                echo "SHEET_RESULT filename=${SLUG}_charref.png subfolder=t2va-single"
                echo "--- [$(date -Iseconds)] t2va-single: $SLUG complete ---"
        ensure:
          in_parallel:
            - task: flush-vram
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                params: { COMFYUI_LOCAL_URL: ((comfyui_local_url)) }
                run:
                  path: sh
                  args:
                    - -c
                    - |
                      apk add --no-cache curl >/dev/null
                      curl -sf -X POST "$COMFYUI_LOCAL_URL/free" \
                        -H 'Content-Type: application/json' \
                        --data '{"unload_models": true, "free_memory": true}' \
                        || echo "WARNING: flush-vram POST /free failed"
                      exit 0
            - put: gpu-lock
              params: { release: gpu-lock }

  - name: t2va-batch-all
    serial_groups: [gpu]
    plan:
      - get: t2va-repo
      - put: gpu-lock
        params: { acquire: true }
      - task: run-batch
        # ~66s/clip observed on the blades68 charref pilot; 30 entries ->
        # ~35-40 real minutes expected, same padding convention as that job.
        timeout: 70m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo }]
          outputs: [{ name: raw-videos }]
          params:
            COMFYUI_LOCAL_URL: ((comfyui_local_url))
            T2VA_LIMIT: ((t2va_limit))
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache curl jq python3 >/dev/null
                cd t2va-repo
                python3 scripts/build_manifest.py ${T2VA_LIMIT:+--limit "$T2VA_LIMIT"}
                MANIFEST=gen/manifest.json
                COUNT=$(jq 'length' "$MANIFEST")
                echo "--- [$(date -Iseconds)] t2va-batch-all: $COUNT clips to render ---"
                i=0
                jq -c '.[]' "$MANIFEST" | while IFS= read -r ENTRY; do
                  i=$((i+1))
                  SLUG=$(echo "$ENTRY" | jq -r '.slug')
                  PROMPT_TEXT=$(echo "$ENTRY" | jq -r '.prompt')
                  SEED=$(echo "$ENTRY" | jq -r '.seed')
                  python3 scripts/build_t2va_prompt.py \
                    --prompt "$PROMPT_TEXT" --seed "$SEED" \
                    --output-prefix "t2va/${SLUG}" \
                    --client-id "t2va-batch-${i}" > /tmp/prompt.json
                  echo "--- [$(date -Iseconds)] ($i/$COUNT) submitting $SLUG (seed=$SEED) ---"
                  RESP=$(curl -sf -X POST "$COMFYUI_LOCAL_URL/prompt" \
                    -H 'Content-Type: application/json' --data @/tmp/prompt.json)
                  PROMPT_ID=$(echo "$RESP" | jq -r .prompt_id)
                  if [ -z "$PROMPT_ID" ] || [ "$PROMPT_ID" = "null" ]; then
                    echo "FAILED to submit $SLUG: $RESP"; exit 1
                  fi
                  COMPLETED=false
                  for j in $(seq 1 60); do
                    sleep 3
                    HIST=$(curl -sf "$COMFYUI_LOCAL_URL/history/$PROMPT_ID") || continue
                    if [ "$HIST" != "{}" ]; then
                      STATUS=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".status.completed")
                      if [ "$STATUS" = "true" ]; then
                        COMPLETED=true
                        COMFY_FILE=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].filename // .\"$PROMPT_ID\".outputs.\"612\".video[0].filename // .\"$PROMPT_ID\".outputs.\"612\".videos[0].filename // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].filename")
                        COMFY_SUBFOLDER=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".video[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".videos[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].subfolder // \"\"")
                        if [ -z "$COMFY_FILE" ] || [ "$COMFY_FILE" = "null" ]; then
                          echo "FAILED: $SLUG completed but no video filename in outputs.612"; exit 1
                        fi
                        curl -sf -G "$COMFYUI_LOCAL_URL/view" \
                          --data-urlencode "filename=$COMFY_FILE" \
                          --data-urlencode "subfolder=$COMFY_SUBFOLDER" \
                          --data-urlencode "type=output" \
                          -o "../raw-videos/${SLUG}.mp4" \
                          || { echo "FAILED to fetch $SLUG"; exit 1; }
                        echo "VIDEO_RESULT slug=$SLUG comfy_filename=$COMFY_FILE prompt_id=$PROMPT_ID"
                        break
                      elif [ "$STATUS" = "false" ] && echo "$HIST" | jq -e ".\"$PROMPT_ID\".status.status_str == \"error\"" >/dev/null 2>&1; then
                        echo "FAILED: $SLUG -- comfyui-local execution error: $(echo "$HIST" | jq -c ".\"$PROMPT_ID\".status")"; exit 1
                      fi
                    fi
                  done
                  if [ "$COMPLETED" != "true" ]; then
                    echo "TIMEOUT waiting for $SLUG (prompt_id=$PROMPT_ID)"; exit 1
                  fi
                done
                cp "$MANIFEST" ../raw-videos/manifest.json
                FETCHED=$(ls ../raw-videos/*.mp4 2>/dev/null | wc -l)
                echo "--- [$(date -Iseconds)] t2va-batch-all: $COUNT clips done, $FETCHED fetched ---"
        ensure:
          in_parallel:
            - task: flush-vram
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                params: { COMFYUI_LOCAL_URL: ((comfyui_local_url)) }
                run:
                  path: sh
                  args:
                    - -c
                    - |
                      apk add --no-cache curl >/dev/null
                      curl -sf -X POST "$COMFYUI_LOCAL_URL/free" \
                        -H 'Content-Type: application/json' \
                        --data '{"unload_models": true, "free_memory": true}' \
                        || echo "WARNING: flush-vram POST /free failed"
                      exit 0
            - put: gpu-lock
              params: { release: gpu-lock }

      - task: extract-and-compose-all
        timeout: 20m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo }, { name: raw-videos }]
          outputs: [{ name: charref-sheets }]
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache python3 ffmpeg imagemagick font-dejavu >/dev/null
                python3 t2va-repo/scripts/extract_and_compose.py --all \
                  --manifest raw-videos/manifest.json \
                  --video-dir raw-videos \
                  --stills-dir /tmp/t2va-stills \
                  --sheets-dir charref-sheets
                COUNT=$(ls charref-sheets/*.png 2>/dev/null | wc -l)
                echo "--- [$(date -Iseconds)] extract-and-compose-all: $COUNT sheets ---"

      - task: package-sheets
        timeout: 5m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: charref-sheets }]
          outputs: [{ name: verified-assets }]
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                # BUILD_JOB_NAME/BUILD_NAME come through empty on this
                # Concourse deployment (confirmed live on blades68-lora's
                # crew-group-portraits-s3 job, build #23) -- a self-generated
                # timestamp is always a valid s3-resource version string.
                RUN_ID="$(date -u +%Y%m%d%H%M%S)"
                mkdir -p verified-assets
                (cd charref-sheets && tar -czf - *.png) > "verified-assets/t2va-sheets-${RUN_ID}.tar.gz"
      - put: t2va-sheets-s3
        params: { file: verified-assets/t2va-sheets-*.tar.gz }
