# T2VA -- Esoteria (1998) character/enemy roster reference-sheet generation.
#
# Ported architecture from blades68-lora's h3-charref-fullredo job (see that
# repo's concourse/pipeline.yml, 2026-08-23): same validated MiniMax H3 T2VA
# (text-to-video+audio, no reference image) node graph, same gpu-lock
# cross-pipeline mutual-exclusion pattern, same
# submit->poll->fetch->extract->compose flow. T2VA mode was chosen
# deliberately, not provisionally -- see ../data/raw_texture_status.md for
# why the Esoteria asset RE work doesn't (yet) provide real character
# textures to condition an R2V (reference-image) render on.
#
# Two jobs:
#   - t2va-single: workshop/regen exactly one roster entry, selected by the
#     ((char_slug)) pipeline var. Re-set the pipeline with a new var value
#     to target a different character -- see README.md for the exact
#     command. This is the "workshop extensively" entry point.
#   - t2va-batch-all: the full 30-entry roster in one gpu-lock-serialized
#     batch, for once the per-character technique is validated.
#
# Never curl comfyui-local's /prompt endpoint outside this pipeline -- see
# the genops AGENTS.md hard rule this repo inherits (no VRAM pre-flight
# check exists, only this gpu-lock mutex).
#
# local-immich-gallery egress (2026-08-24): ported from blades68-lora's
# pipeline (PRs #7/#8, merged same day) -- pushes every finished sheet from
# both jobs into a shared Immich album. Unlike that pipeline's
# krea2-playbook-crew-groups job, which scopes its Immich put to only the
# quality-gated film_print style subset, T2VA has no style-family/
# quality-gate axis at all (plain character/enemy sheets, no film-grade
# variants) -- so both jobs here push unscoped, every sheet they produce.

resource_types:
  - name: immich-api
    type: registry-image
    source:
      repository: ghcr.io/gavmor/immich-concourse-resource
      tag: ((immich_resource_version))

resources:
  - name: t2va-repo
    type: git
    icon: source-repository
    source:
      uri: https://github.com/gavmor/T2VA.git
      branch: main

  # Experiment-only resource for t2va-drawing-tutorial-validate -- this
  # pipeline is set under its own name (not the live `t2va` pipeline), so
  # pinning to the feature branch here doesn't touch production. Distinct
  # from t2va-repo (branch: main) above, which the real jobs still use.
  - name: t2va-repo-experiment
    type: git
    icon: source-repository
    source:
      uri: https://github.com/gavmor/T2VA.git
      branch: feature/h3-drawing-tutorial-sheet

  # Same physical gpu-lock pool blades68-lora's pipeline uses (this box has
  # exactly one GPU) -- cross-pipeline exclusivity requires sharing the one
  # pool, not standing up a second one.
  - name: gpu-lock
    type: pool
    icon: lock
    source:
      uri: git@github.com:gavmor/concourse-locks.git
      branch: main
      pool: gpu
      private_key: ((gpu_lock_repo_private_key))

  # Reuses blades68-lora's existing self-hosted MinIO bucket under a
  # dedicated t2va/ prefix, rather than standing up a second bucket for a
  # pipeline this small.
  - name: t2va-sheets-s3
    type: s3
    icon: archive-outline
    source:
      endpoint: ((minio_endpoint))
      bucket: ((minio_bucket))
      regexp: t2va/t2va-sheets-(.*)\.tar\.gz
      access_key_id: ((minio_access_key))
      secret_access_key: ((minio_secret_key))
      region_name: us-east-1

  # local-immich-gallery: same immich-api resource type as blades68-lora's
  # pipeline, same ((immich_url))/((immich_api_key)) vars -- shared secrets
  # file, same Immich instance, see resource_types comment above for why
  # gavmor/immich-concourse-resource is pinned to edge-b20bf24 not :latest.
  - name: local-immich-gallery
    type: immich-api
    icon: image-multiple
    source:
      host: ((immich_url))
      api_key: ((immich_api_key))

jobs:
  - name: t2va-single
    serial_groups: [gpu]
    plan:
      - get: t2va-repo
      - put: gpu-lock
        params: { acquire: true }
      - task: render-one
        timeout: 15m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo }]
          outputs: [{ name: raw-videos }, { name: charref-sheets }]
          params:
            COMFYUI_LOCAL_URL: ((comfyui_local_url))
            CHAR_SLUG: ((char_slug))
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache curl jq python3 ffmpeg imagemagick font-dejavu >/dev/null
                cd t2va-repo
                python3 scripts/build_manifest.py --slug "$CHAR_SLUG"
                MANIFEST=gen/manifest.json
                ENTRY=$(jq -c '.[0]' "$MANIFEST")
                SLUG=$(echo "$ENTRY" | jq -r '.slug')
                PROMPT_TEXT=$(echo "$ENTRY" | jq -r '.prompt')
                SEED=$(echo "$ENTRY" | jq -r '.seed')
                python3 scripts/build_t2va_prompt.py \
                  --prompt "$PROMPT_TEXT" --seed "$SEED" \
                  --output-prefix "t2va/${SLUG}" \
                  --client-id "t2va-single-${SLUG}" > /tmp/prompt.json
                echo "--- [$(date -Iseconds)] submitting $SLUG (seed=$SEED) ---"
                RESP=$(curl -sf -X POST "$COMFYUI_LOCAL_URL/prompt" \
                  -H 'Content-Type: application/json' --data @/tmp/prompt.json)
                PROMPT_ID=$(echo "$RESP" | jq -r .prompt_id)
                if [ -z "$PROMPT_ID" ] || [ "$PROMPT_ID" = "null" ]; then
                  echo "FAILED to submit $SLUG: $RESP"; exit 1
                fi
                COMPLETED=false
                for j in $(seq 1 60); do
                  sleep 3
                  HIST=$(curl -sf "$COMFYUI_LOCAL_URL/history/$PROMPT_ID") || continue
                  if [ "$HIST" != "{}" ]; then
                    STATUS=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".status.completed")
                    if [ "$STATUS" = "true" ]; then
                      COMPLETED=true
                      COMFY_FILE=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].filename // .\"$PROMPT_ID\".outputs.\"612\".video[0].filename // .\"$PROMPT_ID\".outputs.\"612\".videos[0].filename // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].filename")
                      COMFY_SUBFOLDER=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".video[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".videos[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].subfolder // \"\"")
                      if [ -z "$COMFY_FILE" ] || [ "$COMFY_FILE" = "null" ]; then
                        echo "FAILED: $SLUG completed but no video filename in outputs.612"; exit 1
                      fi
                      curl -sf -G "$COMFYUI_LOCAL_URL/view" \
                        --data-urlencode "filename=$COMFY_FILE" \
                        --data-urlencode "subfolder=$COMFY_SUBFOLDER" \
                        --data-urlencode "type=output" \
                        -o "../raw-videos/${SLUG}.mp4" \
                        || { echo "FAILED to fetch $SLUG"; exit 1; }
                      echo "VIDEO_RESULT slug=$SLUG comfy_filename=$COMFY_FILE prompt_id=$PROMPT_ID"
                      break
                    elif [ "$STATUS" = "false" ] && echo "$HIST" | jq -e ".\"$PROMPT_ID\".status.status_str == \"error\"" >/dev/null 2>&1; then
                      echo "FAILED: $SLUG -- comfyui-local execution error: $(echo "$HIST" | jq -c ".\"$PROMPT_ID\".status")"; exit 1
                    fi
                  fi
                done
                if [ "$COMPLETED" != "true" ]; then
                  echo "TIMEOUT waiting for $SLUG (prompt_id=$PROMPT_ID)"; exit 1
                fi
                python3 scripts/extract_and_compose.py --slug "$SLUG" \
                  --manifest "$MANIFEST" --video-dir ../raw-videos \
                  --stills-dir /tmp/t2va-stills --sheets-dir ../charref-sheets
                # t2va-single's charref-sheets output is ephemeral (this
                # task container is gone once the build ends) -- upload the
                # finished sheet to comfyui-local's own output store so it's
                # actually retrievable afterwards, same pattern
                # h3-charref-fullredo's extract-and-compose task already
                # uses for its final composited sheets.
                SHEET="../charref-sheets/${SLUG}_charref.png"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${SHEET};filename=${SLUG}_charref.png" \
                  -F "type=output" -F "subfolder=t2va-single" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload ${SLUG}_charref.png"; exit 1; }
                echo "SHEET_RESULT filename=${SLUG}_charref.png subfolder=t2va-single"
                echo "--- [$(date -Iseconds)] t2va-single: $SLUG complete ---"
        ensure:
          in_parallel:
            - task: flush-vram
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                params: { COMFYUI_LOCAL_URL: ((comfyui_local_url)) }
                run:
                  path: sh
                  args:
                    - -c
                    - |
                      apk add --no-cache curl >/dev/null
                      curl -sf -X POST "$COMFYUI_LOCAL_URL/free" \
                        -H 'Content-Type: application/json' \
                        --data '{"unload_models": true, "free_memory": true}' \
                        || echo "WARNING: flush-vram POST /free failed"
                      exit 0
            - put: gpu-lock
              params: { release: gpu-lock }

      # local-immich-gallery egress -- unscoped, see comment above jobs:.
      - put: local-immich-gallery
        no_get: true
        params:
          glob: "charref-sheets/*.png"
          visibility: "timeline"
          album: "Esoteria T2VA Character Sheets"
          tags:
            - "Esoteria"
            - "T2VA"
            - "Concourse Render"

  # t2va-drawing-tutorial-validate: single-asset feasibility probe for the
  # H3 drawing-tutorial-sheet experiment (feature/h3-drawing-tutorial-sheet,
  # see experiments/h3-drawing-tutorial-sheet/EXPERIMENT.md). Deliberately
  # NOT wired into the live t2va/t2va-single jobs above -- gets t2va-repo-
  # experiment (this branch) instead of t2va-repo (main), and is meant to
  # be set under its own pipeline name (t2va-drawing-tutorial-validate),
  # never applied over the production `t2va` pipeline.
  - name: t2va-drawing-tutorial-validate
    serial_groups: [gpu]
    plan:
      - get: t2va-repo-experiment
      - put: gpu-lock
        params: { acquire: true }
      - task: render-tutorial-sheet
        timeout: 20m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo-experiment }]
          outputs: [{ name: raw-videos }, { name: tutorial-sheets }]
          params:
            COMFYUI_LOCAL_URL: ((comfyui_local_url))
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache curl jq python3 ffmpeg imagemagick font-dejavu >/dev/null
                cd t2va-repo-experiment
                ASSET_DIR=experiments/h3-drawing-tutorial-sheet
                SLUG=raven
                SEED=900001
                # No #ImageN tokens: unlike the Reddit post's mechanism
                # (a single text-referenced image slot on a reference-
                # conditioning node), MiniMaxH3ImageToVideo pins
                # first_frame/last_frame directly as graph inputs, so the
                # prompt only needs to describe the desired process.
                # v2 (Gavin's feedback on the v1 validation): both endpoint
                # images are now paper-background (blank_canvas_paper.png,
                # raven_reference_paper_bg.png -- the latter background-
                # swapped from the v1 alley-scene still via the edit-image
                # skill/Krea2 Identity Edit LoRA, identity/pose preserved)
                # instead of the live rendered scene, so the morph should
                # carry paper through instead of the cyberpunk alley.
                # v3 (Gavin: v2's early panels were a flat gesture-outline
                # sketch, not construction primitives): prompt now spells
                # out the literal Loomis/Reilly primitive shapes -- sphere/
                # box/cylinder/cone -- as their own explicit blocking-in
                # stage before line art, since the original Reddit prompt's
                # looser "basic forms, shapes, rectangles, cylinders,
                # cones, etc" phrasing rendered as a generic gesture sketch
                # rather than visibly dimensional solid primitives.
                PROMPT="Create a video tutorial of how this reference character image was created, drawn on a plain paper art-instruction sheet with no background scene, using the classic Loomis/Reilly figure-construction method. Start from a blank canvas. Next, block in the figure using literal three-dimensional geometric solid primitives: a sphere for the skull, a box for the ribcage, a box for the pelvis, cylinders for the neck and each limb segment, and cones tapering the torso and joints -- these must look like solid dimensional geometric shapes with visible construction-line edges and shading, like a technical figure-drawing diagram, NOT a flat outline or gesture sketch. Only after the geometric primitive shapes are clearly visible should the drawing refine them into anatomical line art, then add structural detail, then line refinement, then base color, then full rendering, arriving at the final image, which is the reference image: a genetically cloned infiltration specimen (Raven Project), lean tactical bodysuit, energy weapon, cybernetic edge, on a plain paper background."

                echo "--- uploading first/last frame reference images ---"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${ASSET_DIR}/blank_canvas_paper.png;filename=drawing_tutorial_blank_canvas_paper.png" \
                  -F "type=input" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload blank_canvas_paper.png"; exit 1; }
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${ASSET_DIR}/raven_reference_paper_bg.png;filename=drawing_tutorial_raven_reference_paper.png" \
                  -F "type=input" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload raven_reference_paper_bg.png"; exit 1; }

                python3 scripts/build_drawing_tutorial_prompt.py \
                  --prompt "$PROMPT" --seed "$SEED" \
                  --first-frame drawing_tutorial_blank_canvas_paper.png \
                  --last-frame drawing_tutorial_raven_reference_paper.png \
                  --output-prefix "t2va-tutorial/${SLUG}" \
                  --client-id "t2va-tutorial-${SLUG}" > /tmp/prompt.json
                echo "--- [$(date -Iseconds)] submitting $SLUG tutorial-sheet (seed=$SEED) ---"
                RESP=$(curl -sf -X POST "$COMFYUI_LOCAL_URL/prompt" \
                  -H 'Content-Type: application/json' --data @/tmp/prompt.json)
                PROMPT_ID=$(echo "$RESP" | jq -r .prompt_id)
                if [ -z "$PROMPT_ID" ] || [ "$PROMPT_ID" = "null" ]; then
                  echo "FAILED to submit $SLUG: $RESP"; exit 1
                fi
                COMPLETED=false
                for j in $(seq 1 120); do
                  sleep 3
                  HIST=$(curl -sf "$COMFYUI_LOCAL_URL/history/$PROMPT_ID") || continue
                  if [ "$HIST" != "{}" ]; then
                    STATUS=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".status.completed")
                    if [ "$STATUS" = "true" ]; then
                      COMPLETED=true
                      COMFY_FILE=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".video[0].filename // .\"$PROMPT_ID\".outputs.\"612\".videos[0].filename // .\"$PROMPT_ID\".outputs.\"612\".images[0].filename // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].filename")
                      COMFY_SUBFOLDER=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".video[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".videos[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".images[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].subfolder // \"\"")
                      if [ -z "$COMFY_FILE" ] || [ "$COMFY_FILE" = "null" ]; then
                        echo "FAILED: $SLUG completed but no video filename in outputs.612"; exit 1
                      fi
                      curl -sf -G "$COMFYUI_LOCAL_URL/view" \
                        --data-urlencode "filename=$COMFY_FILE" \
                        --data-urlencode "subfolder=$COMFY_SUBFOLDER" \
                        --data-urlencode "type=output" \
                        -o "../raw-videos/${SLUG}_tutorial.mp4" \
                        || { echo "FAILED to fetch $SLUG"; exit 1; }
                      echo "VIDEO_RESULT slug=$SLUG comfy_filename=$COMFY_FILE prompt_id=$PROMPT_ID"
                      break
                    elif [ "$STATUS" = "false" ] && echo "$HIST" | jq -e ".\"$PROMPT_ID\".status.status_str == \"error\"" >/dev/null 2>&1; then
                      echo "FAILED: $SLUG -- comfyui-local execution error: $(echo "$HIST" | jq -c ".\"$PROMPT_ID\".status")"; exit 1
                    fi
                  fi
                done
                if [ "$COMPLETED" != "true" ]; then
                  echo "TIMEOUT waiting for $SLUG (prompt_id=$PROMPT_ID)"; exit 1
                fi
                python3 scripts/extract_and_compose_tutorial_sheet.py --slug "$SLUG" \
                  --video "../raw-videos/${SLUG}_tutorial.mp4" \
                  --stills-dir /tmp/t2va-tutorial-stills \
                  --out "../tutorial-sheets/${SLUG}_tutorial_sheet.png"
                SHEET="../tutorial-sheets/${SLUG}_tutorial_sheet.png"
                echo "${PROMPT}" > "${SHEET}.description.txt"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${SHEET};filename=${SLUG}_tutorial_sheet.png" \
                  -F "type=output" -F "subfolder=t2va-drawing-tutorial-validate" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload ${SLUG}_tutorial_sheet.png"; exit 1; }
                echo "SHEET_RESULT filename=${SLUG}_tutorial_sheet.png subfolder=t2va-drawing-tutorial-validate"
                echo "--- [$(date -Iseconds)] t2va-drawing-tutorial-validate: $SLUG complete ---"
        ensure:
          in_parallel:
            - task: flush-vram
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                params: { COMFYUI_LOCAL_URL: ((comfyui_local_url)) }
                run:
                  path: sh
                  args:
                    - -c
                    - |
                      apk add --no-cache curl >/dev/null
                      curl -sf -X POST "$COMFYUI_LOCAL_URL/free" \
                        -H 'Content-Type: application/json' \
                        --data '{"unload_models": true, "free_memory": true}' \
                        || echo "WARNING: flush-vram POST /free failed"
                      exit 0
            - put: gpu-lock
              params: { release: gpu-lock }

      # local-immich-gallery egress: same convention as t2va-single, so
      # Gavin can eyeball the composited sheet straight from Immich instead
      # of digging into a Concourse build's task output.
      - put: local-immich-gallery
        no_get: true
        params:
          glob: "tutorial-sheets/*.png"
          visibility: "timeline"
          album: "Esoteria T2VA Character Sheets"
          tags:
            - "Esoteria"
            - "T2VA"
            - "Concourse Render"
            - "Experiment"

  # t2va-drawing-tutorial-validate-raven-nohand: single-variable v4 test on
  # top of the validated v3 Loomis-primitive prompt. Independently verified
  # 2026-08-27 real Reddit post (r/StableDiffusion, "Generating 'fake'
  # speedpaint timelapse with MiniMax H3" -- corroborated via a separate
  # third-party summary site quoting the actual permalink, plus a matching
  # toyxyz3 X post, since reddit.com itself is Cloudflare-blocked from here)
  # documents the same construction-sheet technique with one prompt
  # instruction we hadn't tried: explicitly telling H3 to keep only the
  # canvas in frame, no drawing hand/pencil ever visible. Our own v1/v2
  # runs had a hand appear unprompted and we logged it as a nice bonus --
  # but that post's own comment section pushed back hard on the hand look
  # (mocked as "holding the pen at exactly the same angle like a robot"),
  # so this is a real, disputed question worth testing rather than assuming
  # our reaction was the right one. Everything else (asset, seed, images,
  # frame count, resolution) held identical to the validated v3 raven job
  # -- the hand-removal clause is the only variable changed.
  - name: t2va-drawing-tutorial-validate-raven-nohand
    serial_groups: [gpu]
    plan:
      - get: t2va-repo-experiment
      - put: gpu-lock
        params: { acquire: true }
      - task: render-tutorial-sheet
        timeout: 20m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo-experiment }]
          outputs: [{ name: raw-videos }, { name: tutorial-sheets }]
          params:
            COMFYUI_LOCAL_URL: ((comfyui_local_url))
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache curl jq python3 ffmpeg imagemagick font-dejavu >/dev/null
                cd t2va-repo-experiment
                ASSET_DIR=experiments/h3-drawing-tutorial-sheet
                SLUG=raven-nohand
                SEED=900001
                PROMPT="Create a video tutorial of how this reference character image was created, drawn on a plain paper art-instruction sheet with no background scene, using the classic Loomis/Reilly figure-construction method. The camera shows only the canvas from directly above; no hand, pencil, or other drawing implement is ever visible in frame at any point in the video -- only the paper and the marks appearing on it. Start from a blank canvas. Next, block in the figure using literal three-dimensional geometric solid primitives: a sphere for the skull, a box for the ribcage, a box for the pelvis, cylinders for the neck and each limb segment, and cones tapering the torso and joints -- these must look like solid dimensional geometric shapes with visible construction-line edges and shading, like a technical figure-drawing diagram, NOT a flat outline or gesture sketch. Only after the geometric primitive shapes are clearly visible should the drawing refine them into anatomical line art, then add structural detail, then line refinement, then base color, then full rendering, arriving at the final image, which is the reference image: a genetically cloned infiltration specimen (Raven Project), lean tactical bodysuit, energy weapon, cybernetic edge, on a plain paper background."

                echo "--- uploading first/last frame reference images ---"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${ASSET_DIR}/blank_canvas_paper.png;filename=drawing_tutorial_blank_canvas_paper.png" \
                  -F "type=input" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload blank_canvas_paper.png"; exit 1; }
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${ASSET_DIR}/raven_reference_paper_bg.png;filename=drawing_tutorial_raven_reference_paper.png" \
                  -F "type=input" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload raven_reference_paper_bg.png"; exit 1; }

                python3 scripts/build_drawing_tutorial_prompt.py \
                  --prompt "$PROMPT" --seed "$SEED" \
                  --first-frame drawing_tutorial_blank_canvas_paper.png \
                  --last-frame drawing_tutorial_raven_reference_paper.png \
                  --output-prefix "t2va-tutorial/${SLUG}" \
                  --client-id "t2va-tutorial-${SLUG}" > /tmp/prompt.json
                echo "--- [$(date -Iseconds)] submitting $SLUG tutorial-sheet (seed=$SEED) ---"
                RESP=$(curl -sf -X POST "$COMFYUI_LOCAL_URL/prompt" \
                  -H 'Content-Type: application/json' --data @/tmp/prompt.json)
                PROMPT_ID=$(echo "$RESP" | jq -r .prompt_id)
                if [ -z "$PROMPT_ID" ] || [ "$PROMPT_ID" = "null" ]; then
                  echo "FAILED to submit $SLUG: $RESP"; exit 1
                fi
                COMPLETED=false
                for j in $(seq 1 120); do
                  sleep 3
                  HIST=$(curl -sf "$COMFYUI_LOCAL_URL/history/$PROMPT_ID") || continue
                  if [ "$HIST" != "{}" ]; then
                    STATUS=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".status.completed")
                    if [ "$STATUS" = "true" ]; then
                      COMPLETED=true
                      COMFY_FILE=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".video[0].filename // .\"$PROMPT_ID\".outputs.\"612\".videos[0].filename // .\"$PROMPT_ID\".outputs.\"612\".images[0].filename // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].filename")
                      COMFY_SUBFOLDER=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".video[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".videos[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".images[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].subfolder // \"\"")
                      if [ -z "$COMFY_FILE" ] || [ "$COMFY_FILE" = "null" ]; then
                        echo "FAILED: $SLUG completed but no video filename in outputs.612"; exit 1
                      fi
                      curl -sf -G "$COMFYUI_LOCAL_URL/view" \
                        --data-urlencode "filename=$COMFY_FILE" \
                        --data-urlencode "subfolder=$COMFY_SUBFOLDER" \
                        --data-urlencode "type=output" \
                        -o "../raw-videos/${SLUG}_tutorial.mp4" \
                        || { echo "FAILED to fetch $SLUG"; exit 1; }
                      echo "VIDEO_RESULT slug=$SLUG comfy_filename=$COMFY_FILE prompt_id=$PROMPT_ID"
                      break
                    elif [ "$STATUS" = "false" ] && echo "$HIST" | jq -e ".\"$PROMPT_ID\".status.status_str == \"error\"" >/dev/null 2>&1; then
                      echo "FAILED: $SLUG -- comfyui-local execution error: $(echo "$HIST" | jq -c ".\"$PROMPT_ID\".status")"; exit 1
                    fi
                  fi
                done
                if [ "$COMPLETED" != "true" ]; then
                  echo "TIMEOUT waiting for $SLUG (prompt_id=$PROMPT_ID)"; exit 1
                fi
                python3 scripts/extract_and_compose_tutorial_sheet.py --slug "$SLUG" \
                  --video "../raw-videos/${SLUG}_tutorial.mp4" \
                  --stills-dir /tmp/t2va-tutorial-stills \
                  --out "../tutorial-sheets/${SLUG}_tutorial_sheet.png"
                SHEET="../tutorial-sheets/${SLUG}_tutorial_sheet.png"
                echo "${PROMPT}" > "${SHEET}.description.txt"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${SHEET};filename=${SLUG}_tutorial_sheet.png" \
                  -F "type=output" -F "subfolder=t2va-drawing-tutorial-validate" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload ${SLUG}_tutorial_sheet.png"; exit 1; }
                echo "SHEET_RESULT filename=${SLUG}_tutorial_sheet.png subfolder=t2va-drawing-tutorial-validate"
                echo "--- [$(date -Iseconds)] t2va-drawing-tutorial-validate-raven-nohand: $SLUG complete ---"
        ensure:
          in_parallel:
            - task: flush-vram
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                params: { COMFYUI_LOCAL_URL: ((comfyui_local_url)) }
                run:
                  path: sh
                  args:
                    - -c
                    - |
                      apk add --no-cache curl >/dev/null
                      curl -sf -X POST "$COMFYUI_LOCAL_URL/free" \
                        -H 'Content-Type: application/json' \
                        --data '{"unload_models": true, "free_memory": true}' \
                        || echo "WARNING: flush-vram POST /free failed"
                      exit 0
            - put: gpu-lock
              params: { release: gpu-lock }

      - put: local-immich-gallery
        no_get: true
        params:
          glob: "tutorial-sheets/*.png"
          visibility: "timeline"
          album: "Esoteria T2VA Character Sheets"
          tags:
            - "Esoteria"
            - "T2VA"
            - "Concourse Render"
            - "Experiment"

  # t2va-drawing-tutorial-validate-constbot: second-asset expansion of the
  # same v3 (Loomis-primitive) drawing-tutorial-sheet recipe validated on
  # Raven. Deliberately a robot subject (constbot, category "robot" per
  # ../data/roster.json), not another human_trooper -- this is the actual
  # test of whether the sphere/box/cylinder construction-primitive prompt
  # generalizes beyond human anatomy, not just a repeat on a similar asset.
  # Same discipline as Raven: one new asset, isolated job, no batch-all
  # until this validates too.
  - name: t2va-drawing-tutorial-validate-constbot
    serial_groups: [gpu]
    plan:
      - get: t2va-repo-experiment
      - put: gpu-lock
        params: { acquire: true }
      - task: render-tutorial-sheet
        timeout: 20m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo-experiment }]
          outputs: [{ name: raw-videos }, { name: tutorial-sheets }]
          params:
            COMFYUI_LOCAL_URL: ((comfyui_local_url))
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache curl jq python3 ffmpeg imagemagick font-dejavu >/dev/null
                cd t2va-repo-experiment
                ASSET_DIR=experiments/h3-drawing-tutorial-sheet
                SLUG=constbot
                SEED=900001
                # Same v3 Loomis/Reilly primitive-shape prompt text validated
                # on Raven, unchanged in structure -- only the final
                # reference-image descriptor swaps to constbot's own
                # roster.json description. Everything else (seed, paper
                # endpoints, 8-frame extraction) held constant so this run
                # isolates "does the same prompt generalize to a different
                # subject" as the only variable vs. the Raven v3 run.
                PROMPT="Create a video tutorial of how this reference character image was created, drawn on a plain paper art-instruction sheet with no background scene, using the classic Loomis/Reilly figure-construction method. Start from a blank canvas. Next, block in the figure using literal three-dimensional geometric solid primitives: a sphere for the skull, a box for the ribcage, a box for the pelvis, cylinders for the neck and each limb segment, and cones tapering the torso and joints -- these must look like solid dimensional geometric shapes with visible construction-line edges and shading, like a technical figure-drawing diagram, NOT a flat outline or gesture sketch. Only after the geometric primitive shapes are clearly visible should the drawing refine them into anatomical line art, then add structural detail, then line refinement, then base color, then full rendering, arriving at the final image, which is the reference image: a construction/labor robot repurposed as a hostile automaton, blocky riveted chassis, hydraulic limbs, warning-striped panels, on a plain paper background."

                echo "--- uploading first/last frame reference images ---"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${ASSET_DIR}/blank_canvas_paper.png;filename=drawing_tutorial_blank_canvas_paper.png" \
                  -F "type=input" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload blank_canvas_paper.png"; exit 1; }
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${ASSET_DIR}/constbot_reference_paper_bg.png;filename=drawing_tutorial_constbot_reference_paper.png" \
                  -F "type=input" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload constbot_reference_paper_bg.png"; exit 1; }

                python3 scripts/build_drawing_tutorial_prompt.py \
                  --prompt "$PROMPT" --seed "$SEED" \
                  --first-frame drawing_tutorial_blank_canvas_paper.png \
                  --last-frame drawing_tutorial_constbot_reference_paper.png \
                  --output-prefix "t2va-tutorial/${SLUG}" \
                  --client-id "t2va-tutorial-${SLUG}" > /tmp/prompt.json
                echo "--- [$(date -Iseconds)] submitting $SLUG tutorial-sheet (seed=$SEED) ---"
                RESP=$(curl -sf -X POST "$COMFYUI_LOCAL_URL/prompt" \
                  -H 'Content-Type: application/json' --data @/tmp/prompt.json)
                PROMPT_ID=$(echo "$RESP" | jq -r .prompt_id)
                if [ -z "$PROMPT_ID" ] || [ "$PROMPT_ID" = "null" ]; then
                  echo "FAILED to submit $SLUG: $RESP"; exit 1
                fi
                COMPLETED=false
                for j in $(seq 1 120); do
                  sleep 3
                  HIST=$(curl -sf "$COMFYUI_LOCAL_URL/history/$PROMPT_ID") || continue
                  if [ "$HIST" != "{}" ]; then
                    STATUS=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".status.completed")
                    if [ "$STATUS" = "true" ]; then
                      COMPLETED=true
                      COMFY_FILE=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".video[0].filename // .\"$PROMPT_ID\".outputs.\"612\".videos[0].filename // .\"$PROMPT_ID\".outputs.\"612\".images[0].filename // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].filename")
                      COMFY_SUBFOLDER=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".video[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".videos[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".images[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].subfolder // \"\"")
                      if [ -z "$COMFY_FILE" ] || [ "$COMFY_FILE" = "null" ]; then
                        echo "FAILED: $SLUG completed but no video filename in outputs.612"; exit 1
                      fi
                      curl -sf -G "$COMFYUI_LOCAL_URL/view" \
                        --data-urlencode "filename=$COMFY_FILE" \
                        --data-urlencode "subfolder=$COMFY_SUBFOLDER" \
                        --data-urlencode "type=output" \
                        -o "../raw-videos/${SLUG}_tutorial.mp4" \
                        || { echo "FAILED to fetch $SLUG"; exit 1; }
                      echo "VIDEO_RESULT slug=$SLUG comfy_filename=$COMFY_FILE prompt_id=$PROMPT_ID"
                      break
                    elif [ "$STATUS" = "false" ] && echo "$HIST" | jq -e ".\"$PROMPT_ID\".status.status_str == \"error\"" >/dev/null 2>&1; then
                      echo "FAILED: $SLUG -- comfyui-local execution error: $(echo "$HIST" | jq -c ".\"$PROMPT_ID\".status")"; exit 1
                    fi
                  fi
                done
                if [ "$COMPLETED" != "true" ]; then
                  echo "TIMEOUT waiting for $SLUG (prompt_id=$PROMPT_ID)"; exit 1
                fi
                python3 scripts/extract_and_compose_tutorial_sheet.py --slug "$SLUG" \
                  --video "../raw-videos/${SLUG}_tutorial.mp4" \
                  --stills-dir /tmp/t2va-tutorial-stills \
                  --out "../tutorial-sheets/${SLUG}_tutorial_sheet.png"
                SHEET="../tutorial-sheets/${SLUG}_tutorial_sheet.png"
                echo "${PROMPT}" > "${SHEET}.description.txt"
                curl -sf -X POST "$COMFYUI_LOCAL_URL/upload/image" \
                  -F "image=@${SHEET};filename=${SLUG}_tutorial_sheet.png" \
                  -F "type=output" -F "subfolder=t2va-drawing-tutorial-validate" -F "overwrite=true" >/dev/null \
                  || { echo "FAILED to upload ${SLUG}_tutorial_sheet.png"; exit 1; }
                echo "SHEET_RESULT filename=${SLUG}_tutorial_sheet.png subfolder=t2va-drawing-tutorial-validate"
                echo "--- [$(date -Iseconds)] t2va-drawing-tutorial-validate-constbot: $SLUG complete ---"
        ensure:
          in_parallel:
            - task: flush-vram
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                params: { COMFYUI_LOCAL_URL: ((comfyui_local_url)) }
                run:
                  path: sh
                  args:
                    - -c
                    - |
                      apk add --no-cache curl >/dev/null
                      curl -sf -X POST "$COMFYUI_LOCAL_URL/free" \
                        -H 'Content-Type: application/json' \
                        --data '{"unload_models": true, "free_memory": true}' \
                        || echo "WARNING: flush-vram POST /free failed"
                      exit 0
            - put: gpu-lock
              params: { release: gpu-lock }

      - put: local-immich-gallery
        no_get: true
        params:
          glob: "tutorial-sheets/*.png"
          visibility: "timeline"
          album: "Esoteria T2VA Character Sheets"
          tags:
            - "Esoteria"
            - "T2VA"
            - "Concourse Render"
            - "Experiment"

  - name: t2va-batch-all
    serial_groups: [gpu]
    plan:
      - get: t2va-repo
      - put: gpu-lock
        params: { acquire: true }
      - task: run-batch
        # ~66s/clip observed on the blades68 charref pilot; 30 entries ->
        # ~35-40 real minutes expected, same padding convention as that job.
        timeout: 70m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo }]
          outputs: [{ name: raw-videos }]
          params:
            COMFYUI_LOCAL_URL: ((comfyui_local_url))
            T2VA_LIMIT: ((t2va_limit))
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache curl jq python3 >/dev/null
                cd t2va-repo
                python3 scripts/build_manifest.py ${T2VA_LIMIT:+--limit "$T2VA_LIMIT"}
                MANIFEST=gen/manifest.json
                COUNT=$(jq 'length' "$MANIFEST")
                echo "--- [$(date -Iseconds)] t2va-batch-all: $COUNT clips to render ---"
                i=0
                jq -c '.[]' "$MANIFEST" | while IFS= read -r ENTRY; do
                  i=$((i+1))
                  SLUG=$(echo "$ENTRY" | jq -r '.slug')
                  PROMPT_TEXT=$(echo "$ENTRY" | jq -r '.prompt')
                  SEED=$(echo "$ENTRY" | jq -r '.seed')
                  python3 scripts/build_t2va_prompt.py \
                    --prompt "$PROMPT_TEXT" --seed "$SEED" \
                    --output-prefix "t2va/${SLUG}" \
                    --client-id "t2va-batch-${i}" > /tmp/prompt.json
                  echo "--- [$(date -Iseconds)] ($i/$COUNT) submitting $SLUG (seed=$SEED) ---"
                  RESP=$(curl -sf -X POST "$COMFYUI_LOCAL_URL/prompt" \
                    -H 'Content-Type: application/json' --data @/tmp/prompt.json)
                  PROMPT_ID=$(echo "$RESP" | jq -r .prompt_id)
                  if [ -z "$PROMPT_ID" ] || [ "$PROMPT_ID" = "null" ]; then
                    echo "FAILED to submit $SLUG: $RESP"; exit 1
                  fi
                  COMPLETED=false
                  for j in $(seq 1 60); do
                    sleep 3
                    HIST=$(curl -sf "$COMFYUI_LOCAL_URL/history/$PROMPT_ID") || continue
                    if [ "$HIST" != "{}" ]; then
                      STATUS=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".status.completed")
                      if [ "$STATUS" = "true" ]; then
                        COMPLETED=true
                        COMFY_FILE=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].filename // .\"$PROMPT_ID\".outputs.\"612\".video[0].filename // .\"$PROMPT_ID\".outputs.\"612\".videos[0].filename // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].filename")
                        COMFY_SUBFOLDER=$(echo "$HIST" | jq -r ".\"$PROMPT_ID\".outputs.\"612\".images[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".video[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".videos[0].subfolder // .\"$PROMPT_ID\".outputs.\"612\".gifs[0].subfolder // \"\"")
                        if [ -z "$COMFY_FILE" ] || [ "$COMFY_FILE" = "null" ]; then
                          echo "FAILED: $SLUG completed but no video filename in outputs.612"; exit 1
                        fi
                        curl -sf -G "$COMFYUI_LOCAL_URL/view" \
                          --data-urlencode "filename=$COMFY_FILE" \
                          --data-urlencode "subfolder=$COMFY_SUBFOLDER" \
                          --data-urlencode "type=output" \
                          -o "../raw-videos/${SLUG}.mp4" \
                          || { echo "FAILED to fetch $SLUG"; exit 1; }
                        echo "VIDEO_RESULT slug=$SLUG comfy_filename=$COMFY_FILE prompt_id=$PROMPT_ID"
                        break
                      elif [ "$STATUS" = "false" ] && echo "$HIST" | jq -e ".\"$PROMPT_ID\".status.status_str == \"error\"" >/dev/null 2>&1; then
                        echo "FAILED: $SLUG -- comfyui-local execution error: $(echo "$HIST" | jq -c ".\"$PROMPT_ID\".status")"; exit 1
                      fi
                    fi
                  done
                  if [ "$COMPLETED" != "true" ]; then
                    echo "TIMEOUT waiting for $SLUG (prompt_id=$PROMPT_ID)"; exit 1
                  fi
                done
                cp "$MANIFEST" ../raw-videos/manifest.json
                FETCHED=$(ls ../raw-videos/*.mp4 2>/dev/null | wc -l)
                echo "--- [$(date -Iseconds)] t2va-batch-all: $COUNT clips done, $FETCHED fetched ---"
        ensure:
          in_parallel:
            - task: flush-vram
              config:
                platform: linux
                image_resource:
                  type: registry-image
                  source: { repository: alpine }
                params: { COMFYUI_LOCAL_URL: ((comfyui_local_url)) }
                run:
                  path: sh
                  args:
                    - -c
                    - |
                      apk add --no-cache curl >/dev/null
                      curl -sf -X POST "$COMFYUI_LOCAL_URL/free" \
                        -H 'Content-Type: application/json' \
                        --data '{"unload_models": true, "free_memory": true}' \
                        || echo "WARNING: flush-vram POST /free failed"
                      exit 0
            - put: gpu-lock
              params: { release: gpu-lock }

      - task: extract-and-compose-all
        timeout: 20m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: t2va-repo }, { name: raw-videos }]
          outputs: [{ name: charref-sheets }]
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                apk add --no-cache python3 ffmpeg imagemagick font-dejavu >/dev/null
                python3 t2va-repo/scripts/extract_and_compose.py --all \
                  --manifest raw-videos/manifest.json \
                  --video-dir raw-videos \
                  --stills-dir /tmp/t2va-stills \
                  --sheets-dir charref-sheets
                COUNT=$(ls charref-sheets/*.png 2>/dev/null | wc -l)
                echo "--- [$(date -Iseconds)] extract-and-compose-all: $COUNT sheets ---"

      - task: package-sheets
        timeout: 5m
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          inputs: [{ name: charref-sheets }]
          outputs: [{ name: verified-assets }]
          run:
            path: sh
            args:
              - -c
              - |
                set -e
                # BUILD_JOB_NAME/BUILD_NAME come through empty on this
                # Concourse deployment (confirmed live on blades68-lora's
                # crew-group-portraits-s3 job, build #23) -- a self-generated
                # timestamp is always a valid s3-resource version string.
                RUN_ID="$(date -u +%Y%m%d%H%M%S)"
                mkdir -p verified-assets
                (cd charref-sheets && tar -czf - *.png) > "verified-assets/t2va-sheets-${RUN_ID}.tar.gz"
      - put: t2va-sheets-s3
        params: { file: verified-assets/t2va-sheets-*.tar.gz }

      # local-immich-gallery egress: lands after the s3 put so a
      # failed/slow Immich upload never blocks the archival publish this
      # job already depends on. Unscoped, see comment above jobs:.
      - put: local-immich-gallery
        no_get: true
        params:
          glob: "charref-sheets/*.png"
          visibility: "timeline"
          album: "Esoteria T2VA Character Sheets"
          tags:
            - "Esoteria"
            - "T2VA"
            - "Concourse Render"
